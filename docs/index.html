<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>语音模仿相似度比对</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #fff; --text: #1f2330; --muted: #6b7280;
    --accent: #3b6ef5; --accent-soft: #e8efff; --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); padding: 24px; }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; margin-bottom: 16px; }
  .label { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { font-size: 14px; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--border);
    background: #fff; color: var(--text); cursor: pointer; transition: .15s; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .file-name { font-size: 13px; color: var(--muted); margin-left: 6px; }
  audio { width: 100%; margin-top: 10px; display: none; }
  .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #e23b3b;
    display: inline-block; margin-right: 6px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .bar-row { margin: 12px 0; }
  .bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .bar-track { height: 12px; background: #eef0f4; border-radius: 8px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#3b6ef5,#6f9bff); transition: width .5s; }
  .total-box { margin-top: 18px; padding: 16px; border-radius: 12px; background: var(--accent-soft); text-align: center; }
  .total-box .num { font-size: 40px; font-weight: 700; color: var(--accent); }
  .total-box .lbl { font-size: 13px; color: var(--muted); }
  .total-box .verdict { font-size: 14px; margin-top: 6px; color: var(--text); }
  .status { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .err { color: #b3261e; font-size: 13px; margin-top: 10px; display: none; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>语音模仿相似度比对</h1>
  <div class="sub">上传一段原音频，然后对着麦克风模仿它，看看你模仿得有多像。<br>
    全程在<b>你的浏览器本地</b>完成计算，不上传任何服务器。</div>

  <!-- 原音频 -->
  <div class="card">
    <div class="label">① 原音频（你想让人模仿的）</div>
    <div class="row">
      <input type="file" id="origFile" accept="audio/*" />
      <span class="file-name" id="origName"></span>
    </div>
    <audio id="origAudio" controls></audio>
  </div>

  <!-- 模仿录音 -->
  <div class="card">
    <div class="label">② 你的模仿</div>
    <div class="row">
      <button id="recBtn">开始录音</button>
      <span id="recStatus"></span>
      <span class="file-name" id="mimicName"></span>
    </div>
    <audio id="mimicAudio" controls></audio>
  </div>

  <!-- 比对 -->
  <div class="card">
    <div class="row">
      <button class="primary" id="compareBtn" disabled>开始比对</button>
    </div>
    <div class="status" id="status"></div>
    <div class="err" id="err"></div>

    <div id="result" style="display:none; margin-top:14px;">
      <div class="bar-row">
        <div class="bar-label"><span>音色相似度</span><b id="mfccVal">0%</b></div>
        <div class="bar-track"><div class="bar-fill" id="mfccBar"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>音高 / 语调相似度</span><b id="pitchVal">0%</b></div>
        <div class="bar-track"><div class="bar-fill" id="pitchBar"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>能量 / 节奏相似度</span><b id="energyVal">0%</b></div>
        <div class="bar-track"><div class="bar-fill" id="energyBar"></div></div>
      </div>
      <div class="total-box">
        <div class="num" id="totalNum">0%</div>
        <div class="lbl">综合相似度（声纹特征）</div>
        <div class="verdict" id="verdict"></div>
      </div>
    </div>
  </div>

  <div class="hint">
    说明：分数基于整段音频的"音色 / 语调 / 能量"轮廓做余弦相似度（浏览器端实时计算）。<br>
    只比"声音像不像"，不校验说了什么内容——若模仿者说了完全不同的词，分数仍可能偏高。
  </div>
</div>

<script src="core.js"></script>
<script>
  let origBuf = null;   // decoded AudioBuffer
  let mimicBuf = null;
  let mediaRecorder = null, recChunks = [], recStream = null;

  const $ = id => document.getElementById(id);
  const statusEl = $('status'), errEl = $('err');

  function showErr(msg) { errEl.textContent = msg; errEl.style.display = 'block'; }
  function clearErr() { errEl.style.display = 'none'; }

  // ---- 解码音频文件 -> Float32(16k 单声道) ----
  async function decodeFile(file) {
    const arr = await file.arrayBuffer();
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const buf = await ctx.decodeAudioData(arr);
    return toMono16k(buf, ctx);
  }

  function toMono16k(buf, ctx) {
    const ch = buf.getChannelData(0);
    const fromSr = buf.sampleRate;
    const toSr = 16000;
    const out = new Float32Array(Math.floor(ch.length * toSr / fromSr));
    for (let i = 0; i < out.length; i++) {
      const x = i * (ch.length - 1) / (out.length - 1);
      const i0 = Math.floor(x), i1 = Math.min(i0 + 1, ch.length - 1);
      out[i] = ch[i0] + (ch[i1] - ch[i0]) * (x - i0);
    }
    return out;
  }

  // ---- 原音频 ----
  $('origFile').addEventListener('change', async e => {
    clearErr();
    const f = e.target.files[0]; if (!f) return;
    $('origName').textContent = f.name;
    statusEl.textContent = '解码中…';
    try {
      origBuf = await decodeFile(f);
      const url = URL.createObjectURL(f);
      $('origAudio').src = url; $('origAudio').style.display = 'block';
      statusEl.textContent = '原音频已就绪（' + origBuf.length + ' 采样）';
      refreshCompareBtn();
    } catch (err) { showErr('原音频解码失败：' + err.message); statusEl.textContent = ''; }
  });

  // ---- 录音 ----
  $('recBtn').addEventListener('click', async () => {
    clearErr();
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop(); return;
    }
    try {
      recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recChunks = [];
      mediaRecorder = new MediaRecorder(recStream);
      mediaRecorder.ondataavailable = e => recChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        $('recStatus').innerHTML = '';
        statusEl.textContent = '解码录音中…';
        const blob = new Blob(recChunks, { type: mediaRecorder.mimeType });
        const file = new File([blob], 'mimic.webm');
        try {
          mimicBuf = await decodeFile(file);
          const url = URL.createObjectURL(blob);
          $('mimicAudio').src = url; $('mimicAudio').style.display = 'block';
          $('mimicName').textContent = '录音 ' + (mimicBuf.length / 16000).toFixed(1) + 's';
          statusEl.textContent = '录音已就绪';
          refreshCompareBtn();
        } catch (err) { showErr('录音解码失败：' + err.message); statusEl.textContent = ''; }
        recStream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      $('recStatus').innerHTML = '<span class="rec-dot"></span> 录音中…再次点击停止';
      statusEl.textContent = '';
    } catch (err) { showErr('无法访问麦克风：' + err.message); }
  });

  function refreshCompareBtn() {
    $('compareBtn').disabled = !(origBuf && mimicBuf);
  }

  // ---- 比对 ----
  $('compareBtn').addEventListener('click', () => {
    clearErr();
    if (!origBuf || !mimicBuf) return;
    statusEl.textContent = '计算中…';
    // 让 UI 先刷新
    setTimeout(() => {
      try {
        const r = window.VoiceCompare.compare(origBuf, mimicBuf);
        showResult(r);
        statusEl.textContent = '';
      } catch (err) { showErr('计算失败：' + err.message); statusEl.textContent = ''; }
    }, 30);
  });

  function showResult(d) {
    const pct = v => Math.round(v * 100) + '%';
    const set = (barId, valId, v) => {
      $(barId).style.width = Math.round(v * 100) + '%';
      $(valId).textContent = pct(v);
    };
    set('mfccBar', 'mfccVal', d.mfcc);
    set('pitchBar', 'pitchVal', d.pitch);
    set('energyBar', 'energyVal', d.energy);
    $('totalNum').textContent = pct(d.total);
    $('verdict').textContent = verdict(d.total);
    $('result').style.display = 'block';
  }

  function verdict(t) {
    if (t >= 0.85) return '几乎一模一样 🎯';
    if (t >= 0.7) return '非常像 👍';
    if (t >= 0.5) return '比较像 🙂';
    if (t >= 0.3) return '有点像 🤔';
    return '不太像 😅';
  }
</script>
</body>
</html>
